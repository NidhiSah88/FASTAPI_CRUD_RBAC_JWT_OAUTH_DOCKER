version: '3.9'
services:
 # container 1
  db:
    image: mysql:8.0
    container_name: mysql_container
    environment:
      # MYSQL_ROOT_PASSWORD: ""
      MYSQL_ROOT_HOST: "%"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "fastapi_db"
      
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5



      # container 2
  fastapi:
    build: .
    container_name: fastapi_app
    depends_on:
      db: 
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=db 
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=fastapi_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=

volumes:
  mysql_data:
    # command: uvicorn main:app --host 0.0.0.0 --port 8000




















